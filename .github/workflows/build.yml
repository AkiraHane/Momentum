name: Build and Publish

on:
  push:
    # Full build tags only; aggregate tags such as v2.0.2 do not trigger builds.
    tags: ['v*-*-*']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release files
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      mod_version: ${{ steps.mod-info.outputs.mod_version }}
      base_version: ${{ steps.mod-info.outputs.base_version }}
      github_release_tag: ${{ steps.mod-info.outputs.github_release_tag }}
      release_version: ${{ steps.mod-info.outputs.release_version }}
      minecraft_version: ${{ steps.mod-info.outputs.minecraft_version }}
      publish_type: ${{ steps.mod-info.outputs.publish_type }}
      neoforge_file: ${{ steps.mod-info.outputs.neoforge_file }}
      fabric_file: ${{ steps.mod-info.outputs.fabric_file }}
      artifact_name: ${{ steps.mod-info.outputs.artifact_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # This is needed to be able to run ./gradlew below
      # You can run `git update-index --chmod +x gradlew` then remove this step.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Get mod info
        id: mod-info
        shell: bash
        run: |
          MOD_ID=$(grep -m1 '^mod_id' gradle.properties | sed 's/.*=\s*//')
          MOD_VERSION=$(grep -m1 '^mod_version' gradle.properties | sed 's/.*=\s*//')
          MOD_BUILD=$(grep -m1 '^mod_build' gradle.properties | sed 's/.*=\s*//')
          MOD_PRERELEASE=$(grep -m1 '^mod_prerelease' gradle.properties | sed 's/.*=\s*//')
          MINECRAFT_VERSION=$(grep -m1 '^minecraft_version' gradle.properties | sed 's/.*=\s*//')

          BASE_VERSION="${MOD_VERSION}.${MOD_BUILD}"
          FULL_VERSION="${BASE_VERSION}-${MOD_PRERELEASE}"
          RELEASE_VERSION="${FULL_VERSION}+mc${MINECRAFT_VERSION}"
          EXPECTED_TAG="v${BASE_VERSION}-${MINECRAFT_VERSION}-${MOD_PRERELEASE}"

          if [[ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]]; then
            echo "::error title=Version mismatch::Tag must be $EXPECTED_TAG, but got $GITHUB_REF_NAME"
            exit 1
          fi

          if [[ "$MOD_PRERELEASE" == "release" || -z "$MOD_PRERELEASE" ]]; then
            PUBLISH_TYPE="release"
          elif [[ "$MOD_PRERELEASE" == beta* || "$MOD_PRERELEASE" == rc* ]]; then
            PUBLISH_TYPE="beta"
          else
            PUBLISH_TYPE="alpha"
          fi

          echo "mod_id=$MOD_ID" >> "$GITHUB_OUTPUT"
          echo "mod_version=$FULL_VERSION" >> "$GITHUB_OUTPUT"
          echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "github_release_tag=v${BASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "minecraft_version=$MINECRAFT_VERSION" >> "$GITHUB_OUTPUT"
          echo "publish_type=$PUBLISH_TYPE" >> "$GITHUB_OUTPUT"
          echo "neoforge_file=${MOD_ID}-neoforge-${MINECRAFT_VERSION}-${FULL_VERSION}.jar" >> "$GITHUB_OUTPUT"
          echo "fabric_file=${MOD_ID}-fabric-${MINECRAFT_VERSION}-${FULL_VERSION}.jar" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${MOD_ID}-${MINECRAFT_VERSION}-${FULL_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build with Gradle
        run: ./gradlew build

      - name: Collect release files
        env:
          NEOFORGE_FILE: ${{ steps.mod-info.outputs.neoforge_file }}
          FABRIC_FILE: ${{ steps.mod-info.outputs.fabric_file }}
        run: |
          mkdir -p release
          cp "neoforge/build/libs/$NEOFORGE_FILE" release/
          cp "fabric/build/libs/$FABRIC_FILE" release/

      - name: Generate notes for this build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Compare against an ancestor build tag, excluding aggregate tags.
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 --match 'v*-*' "${GITHUB_SHA}^" 2>/dev/null || true)
          NOTE_ARGS=(-f "tag_name=$GITHUB_REF_NAME")
          if [[ -n "$PREVIOUS_TAG" ]]; then
            NOTE_ARGS+=(-f "previous_tag_name=$PREVIOUS_TAG")
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            "${NOTE_ARGS[@]}" --jq .body > "$RUNNER_TEMP/generated-release-notes.md"
          {
            printf '## [%s](%s/%s/tree/%s)\n\n' \
              "$GITHUB_REF_NAME" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"
            sed 's/^#/##/' "$RUNNER_TEMP/generated-release-notes.md"
          } > release/release-notes.md

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.mod-info.outputs.artifact_name }}
          path: release/
          if-no-files-found: error

  github-release:
    name: Update aggregate GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Serialize only the shared Release update; builds and approvals remain independent.
    concurrency:
      group: github-release-${{ needs.build.outputs.github_release_tag }}
      cancel-in-progress: false
      queue: max
    steps:
      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release

      - name: Create or update aggregate Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.github_release_tag }}
          BASE_VERSION: ${{ needs.build.outputs.base_version }}
          PUBLISH_TYPE: ${{ needs.build.outputs.publish_type }}
        run: |
          # A failed API request must stop the job rather than look like a missing Release.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\")" > "$RUNNER_TEMP/existing-release.json"
          ENTRY_MARKER="<!-- momentum-release:$GITHUB_REF_NAME -->"

          if [[ ! -s "$RUNNER_TEMP/existing-release.json" ]]; then
            {
              printf '%s\n' "$ENTRY_MARKER"
              cat release/release-notes.md
            } > "$RUNNER_TEMP/aggregate-notes.md"
            CREATE_ARGS=(--target "$GITHUB_SHA" --title "Momentum $BASE_VERSION"
              --notes-file "$RUNNER_TEMP/aggregate-notes.md")
            if [[ "$PUBLISH_TYPE" != "release" ]]; then
              CREATE_ARGS+=(--prerelease)
            fi
            # The aggregate tag is created at this first build's commit and stays fixed.
            gh release create "$RELEASE_TAG" release/*.jar "${CREATE_ARGS[@]}"
          else
            if [[ $(jq -r '.immutable' "$RUNNER_TEMP/existing-release.json") == "true" ]]; then
              echo "::error::Release $RELEASE_TAG is immutable; aggregate releases require editable assets."
              exit 1
            fi

            # Keep previous Minecraft versions and test builds; retries reuse existing assets.
            jq -r '.assets[].name' "$RUNNER_TEMP/existing-release.json" > "$RUNNER_TEMP/existing-assets.txt"
            for FILE in release/*.jar; do
              if ! grep -Fxq "$(basename "$FILE")" "$RUNNER_TEMP/existing-assets.txt"; then
                gh release upload "$RELEASE_TAG" "$FILE"
              fi
            done

            jq -r '.body // ""' "$RUNNER_TEMP/existing-release.json" > "$RUNNER_TEMP/aggregate-notes.md"
            if ! grep -Fxq "$ENTRY_MARKER" "$RUNNER_TEMP/aggregate-notes.md"; then
              {
                printf '\n%s\n' "$ENTRY_MARKER"
                cat release/release-notes.md
              } >> "$RUNNER_TEMP/aggregate-notes.md"
            fi
            EDIT_ARGS=(--notes-file "$RUNNER_TEMP/aggregate-notes.md" --draft=false)
            # Promote on the first stable build; later test builds never downgrade the Release.
            if [[ "$PUBLISH_TYPE" == "release" ]]; then
              EDIT_ARGS+=(--prerelease=false)
            fi
            gh release edit "$RELEASE_TAG" "${EDIT_ARGS[@]}"
          fi

  publish:
    name: Publish to Modrinth and CurseForge
    needs: [build, github-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Enable required reviewers for this environment in repository settings.
    environment: release
    steps:
      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release

      - name: Validate publishing secrets
        shell: bash
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          if [[ -z "$MODRINTH_TOKEN" ]]; then
            echo "::error title=Missing secret::Add MODRINTH_TOKEN under repository or release environment secrets"
            exit 1
          fi
          if [[ -z "$CURSEFORGE_TOKEN" ]]; then
            echo "::error title=Missing secret::Add CURSEFORGE_TOKEN under repository or release environment secrets"
            exit 1
          fi

      - name: Publish NeoForge to Modrinth and CurseForge
        # Pin the third-party action to the v3.3.1 commit because it receives publishing secrets.
        uses: Kir-Antipov/mc-publish@52307b03863581dec6b652b83e597aec02ebb075
        with:
          files: release/${{ needs.build.outputs.neoforge_file }}

          name: Momentum ${{ needs.build.outputs.mod_version }} for Minecraft ${{ needs.build.outputs.minecraft_version }} (NeoForge)
          version: ${{ needs.build.outputs.release_version }}-neoforge
          version-type: ${{ needs.build.outputs.publish_type }}
          changelog-file: release/release-notes.md

          loaders: neoforge
          game-versions: ${{ needs.build.outputs.minecraft_version }}
          environment: client | server
          java: 25
          dependencies: |
            player-animation-library(required){modrinth:ha1mEyJS}{curseforge:1283899}
            curios(optional){modrinth:vvuO3ImH}{curseforge:309927}

          modrinth-id: tdSV3GtS
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          curseforge-id: 1583971
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          fail-mode: fail

      - name: Publish Fabric to Modrinth and CurseForge
        # Pin the third-party action to the v3.3.1 commit because it receives publishing secrets.
        uses: Kir-Antipov/mc-publish@52307b03863581dec6b652b83e597aec02ebb075
        with:
          files: release/${{ needs.build.outputs.fabric_file }}

          name: Momentum ${{ needs.build.outputs.mod_version }} for Minecraft ${{ needs.build.outputs.minecraft_version }} (Fabric)
          version: ${{ needs.build.outputs.release_version }}-fabric
          version-type: ${{ needs.build.outputs.publish_type }}
          changelog-file: release/release-notes.md

          loaders: fabric
          game-versions: ${{ needs.build.outputs.minecraft_version }}
          environment: client | server
          java: 25
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
            player-animation-library(required){modrinth:ha1mEyJS}{curseforge:1283899}
            trinkets-updated(optional){modrinth:XaT8sLP6}{curseforge:1509777}

          modrinth-id: tdSV3GtS
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          curseforge-id: 1583971
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          fail-mode: fail
