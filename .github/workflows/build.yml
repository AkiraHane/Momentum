name: Build and Publish

on:
  push:
    tags: ['v*']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # This is needed to be able to run ./gradlew below
      # You can run `git update-index --chmod +x gradlew` then remove this step.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Get mod info
        id: mod-info
        shell: bash
        run: |
          MOD_ID=$(grep -m1 '^mod_id' gradle.properties | sed 's/.*=\s*//')
          MOD_VERSION=$(grep -m1 '^mod_version' gradle.properties | sed 's/.*=\s*//')
          MOD_BUILD=$(grep -m1 '^mod_build' gradle.properties | sed 's/.*=\s*//')
          MOD_PRERELEASE=$(grep -m1 '^mod_prerelease' gradle.properties | sed 's/.*=\s*//')
          MINECRAFT_VERSION=$(grep -m1 '^minecraft_version' gradle.properties | sed 's/.*=\s*//')

          FULL_VERSION="${MOD_VERSION}.${MOD_BUILD}-${MOD_PRERELEASE}"
          RELEASE_VERSION="${FULL_VERSION}+mc${MINECRAFT_VERSION}"
          EXPECTED_TAG="v${RELEASE_VERSION}"

          if [[ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]]; then
            echo "::error title=Version mismatch::Tag must be $EXPECTED_TAG, but got $GITHUB_REF_NAME"
            exit 1
          fi

          if [[ "$MOD_PRERELEASE" == "release" || -z "$MOD_PRERELEASE" ]]; then
            PUBLISH_TYPE="release"
          elif [[ "$MOD_PRERELEASE" == beta* || "$MOD_PRERELEASE" == rc* ]]; then
            PUBLISH_TYPE="beta"
          else
            PUBLISH_TYPE="alpha"
          fi

          echo "mod_id=$MOD_ID" >> "$GITHUB_OUTPUT"
          echo "mod_version=$FULL_VERSION" >> "$GITHUB_OUTPUT"
          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "mod_prerelease=$MOD_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "minecraft_version=$MINECRAFT_VERSION" >> "$GITHUB_OUTPUT"
          echo "publish_type=$PUBLISH_TYPE" >> "$GITHUB_OUTPUT"
          echo "neoforge_file=${MOD_ID}-neoforge-${MINECRAFT_VERSION}-${FULL_VERSION}.jar" >> "$GITHUB_OUTPUT"
          echo "fabric_file=${MOD_ID}-fabric-${MINECRAFT_VERSION}-${FULL_VERSION}.jar" >> "$GITHUB_OUTPUT"

      - name: Validate publishing secrets
        shell: bash
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          if [[ -z "$MODRINTH_TOKEN" ]]; then
            echo "::error title=Missing secret::Add MODRINTH_TOKEN under repository Actions secrets"
            exit 1
          fi
          if [[ -z "$CURSEFORGE_TOKEN" ]]; then
            echo "::error title=Missing secret::Add CURSEFORGE_TOKEN under repository Actions secrets"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.mod-info.outputs.mod_id }}-${{ steps.mod-info.outputs.minecraft_version }}-${{ steps.mod-info.outputs.mod_version }}
          path: |
            neoforge/build/libs/${{ steps.mod-info.outputs.neoforge_file }}
            fabric/build/libs/${{ steps.mod-info.outputs.fabric_file }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Momentum ${{ steps.mod-info.outputs.mod_version }} for Minecraft ${{ steps.mod-info.outputs.minecraft_version }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ steps.mod-info.outputs.mod_prerelease != '' && steps.mod-info.outputs.mod_prerelease != 'release' }}
          files: |
            neoforge/build/libs/${{ steps.mod-info.outputs.neoforge_file }}
            fabric/build/libs/${{ steps.mod-info.outputs.fabric_file }}
          generate_release_notes: true

      - name: Export GitHub release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build
          gh release view "$GITHUB_REF_NAME" \
            --json body \
            --jq .body > build/release-notes.md

      - name: Publish NeoForge to Modrinth and CurseForge
        # Pin the third-party action to the v3.3.1 commit because it receives publishing secrets.
        uses: Kir-Antipov/mc-publish@52307b03863581dec6b652b83e597aec02ebb075
        with:
          files: neoforge/build/libs/${{ steps.mod-info.outputs.neoforge_file }}

          name: Momentum ${{ steps.mod-info.outputs.mod_version }} for Minecraft ${{ steps.mod-info.outputs.minecraft_version }} (NeoForge)
          version: ${{ steps.mod-info.outputs.release_version }}-neoforge
          version-type: ${{ steps.mod-info.outputs.publish_type }}
          changelog-file: build/release-notes.md

          loaders: neoforge
          game-versions: ${{ steps.mod-info.outputs.minecraft_version }}
          environment: client | server
          java: 25
          dependencies: |
            player-animation-library(required){modrinth:ha1mEyJS}{curseforge:1283899}
            curios(optional){modrinth:vvuO3ImH}{curseforge:309927}

          modrinth-id: tdSV3GtS
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          curseforge-id: 1583971
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          fail-mode: fail

      - name: Publish Fabric to Modrinth and CurseForge
        # Pin the third-party action to the v3.3.1 commit because it receives publishing secrets.
        uses: Kir-Antipov/mc-publish@52307b03863581dec6b652b83e597aec02ebb075
        with:
          files: fabric/build/libs/${{ steps.mod-info.outputs.fabric_file }}

          name: Momentum ${{ steps.mod-info.outputs.mod_version }} for Minecraft ${{ steps.mod-info.outputs.minecraft_version }} (Fabric)
          version: ${{ steps.mod-info.outputs.release_version }}-fabric
          version-type: ${{ steps.mod-info.outputs.publish_type }}
          changelog-file: build/release-notes.md

          loaders: fabric
          game-versions: ${{ steps.mod-info.outputs.minecraft_version }}
          environment: client | server
          java: 25
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
            player-animation-library(required){modrinth:ha1mEyJS}{curseforge:1283899}
            trinkets-updated(optional){modrinth:XaT8sLP6}{curseforge:1509777}

          modrinth-id: tdSV3GtS
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          curseforge-id: 1583971
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          fail-mode: fail
