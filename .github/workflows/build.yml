name: Build

on:
  push:
    tags: ['v*']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # This is needed to be able to run ./gradlew below
      # You can run `git update-index --chmod +x gradlew` then remove this step.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Get mod info
        id: mod-info
        run: |
          MOD_ID=$(grep -m1 '^mod_id' gradle.properties | sed 's/.*=\s*//')
          MOD_VERSION=$(grep -m1 '^mod_version' gradle.properties | sed 's/.*=\s*//')
          MOD_BUILD=$(grep -m1 '^mod_build' gradle.properties | sed 's/.*=\s*//')
          MOD_PRERELEASE=$(grep -m1 '^mod_prerelease' gradle.properties | sed 's/.*=\s*//')
          echo "mod_id=$MOD_ID" >> "$GITHUB_OUTPUT"
          echo "mod_version=${MOD_VERSION}.${MOD_BUILD}-${MOD_PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.mod-info.outputs.mod_id }}-${{ steps.mod-info.outputs.mod_version }}
          path: build/libs/*.jar